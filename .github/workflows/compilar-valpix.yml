name: Compilar VALPIX Mini
on: workflow_dispatch
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v4
      - name: Preparar projeto e voz portuguesa
        run: |
          unzip -q VALPIX_Maos_Livres_22.zip 'mini22/*'
          curl --fail --location --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip -o voz.zip
          unzip -q voz.zip -d voz
          model=$(find voz -name final.mdl -print -quit)
          test -n "$model"
          root=$(find voz -mindepth 1 -maxdepth 1 -type d ! -name __MACOSX -print -quit)
          dest=mini22/app/src/main/assets/model
          mkdir -p "$dest"
          cp -R "$root"/. "$dest"/
          echo vosk-pt-0.3 > "$dest/uuid"
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: gradle -p mini22 --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VALPIX-Mini-Redmi
          path: mini22/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
